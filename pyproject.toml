[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miner-cli"
version = "0.1.0"
description = "Docker-based LLM deployment helper for single Ubuntu hosts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.11,<0.12"]

[project.scripts]
miner-cli = "miner_cli.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miner_cli = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[dependency-groups]
dev = ["ruff>=0.11.13"]

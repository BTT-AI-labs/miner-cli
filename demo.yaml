name: demo
engine: vllm
model: Qwen/Qwen2.5-7B-Instruct
image: vllm/vllm-openai:latest
host: 0.0.0.0
port: 8000
tensor_parallel: 1
gpu_ids: all
trust_remote_code: true
dtype: bfloat16
max_model_len: 32768
hf_token_env: HF_TOKEN
hf_cache: /data/huggingface
shm_size: 16g
extra_args:
- --max-num-seqs
- '16'
env: {}
dcgm_exporter:
  enabled: false
  gpus: all
miner_client:
  enabled: false
  image: ${ask for dev}
  listen_host: 127.0.0.1
  listen_port: 8080
  public_ip: ${public ip for vllm inference endpoint}
  gpus: all
  volumes:
    - /data/minerhome:/root/.miner
  environment:
    LOG_LEVEL: info
    MAIN_API_BASE_URL: ${ask for dev}
    MINER_TOKEN: ${replace-me}
    MINER_TARGET_MODEL: Qwen/Qwen2.5-7B-Instruct
    MINER_HOME: /root/.miner
    MINER_RUNTIME_TYPE: vllm
extra_services: {}
